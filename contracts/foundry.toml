[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fuzz.runs = 512
invariant.runs = 128
invariant.depth = 64
invariant.fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
